base: &base

  # Model config
  embed_dim: 384
  depth: 12
  dropout: 0.0
  patch_size: 8
  num_heads: 8

  # Training config
  img_size: [360, 720]
  dt: 1 
  global_batch_size: 16 # number of samples per training batch
  num_iters: 30000
  amp_mode: none
  enable_fused: false
  enable_jit: false
  expdir: './logs'
  lr_schedule: 'cosine'
  lr: 5E-4
  warmup: 100
  optimizer: 'Adam'

  # Data
  data_loader_config: 'pytorch'
  num_data_workers: 0 # number of dataloader worker threads per proc
  n_in_channels: 20
  n_out_channels: 20
  train_data_path:   '../nersc_data/train'
  valid_data_path:   '../nersc_data/valid'
  inf_data_path:     '../nersc_data/test'
  time_means_path:   '../nersc_data/stats/time_means.npy'
  global_means_path: '../nersc_data/stats/global_means.npy'
  global_stds_path:  '../nersc_data/stats/global_stds.npy'

  # Comms
  wireup_info: env
  wireup_store: tcp

# limit the number of samples
short: &short_ls
  <<: *base
  limit_nsamples: 512
  limit_nsamples_val: 128
  num_iters: 128

# limit global batch size because of memory issue
short_dali: &short_ls_dali
  <<: *base
  limit_nsamples: 512
  limit_nsamples_val: 128
  num_iters: 256
  global_batch_size: 8

# add optimization flags
short_opt:
  <<: *short_ls
  data_loader_config: 'dali'
  num_data_workers: 8
  amp_mode: fp16
  enable_jit: true
  enable_fused: true

# no samples limits
opt: &opt
  <<: *base
  data_loader_config: 'dali'
  num_data_workers: 8
  amp_mode: fp16
  enable_jit: true
  enable_fused: true

# ----- Data parallel scaling configs
bs2_opt:
  <<: *opt
  global_batch_size: 2
  lr: 1.77e-4

bs4_opt:
  <<: *opt
  global_batch_size: 4
  lr: 2.5e-4

bs8_opt:
  <<: *opt
  global_batch_size: 8
  lr: 3.54e-4

bs16_opt:
  <<: *opt
  global_batch_size: 16
  lr: 5e-4

bs32_opt:
  <<: *opt
  global_batch_size: 32
  lr: 7.07e-4

bs64_opt:
  <<: *opt
  global_batch_size: 64
  lr: 1e-3

bs128_opt:
  <<: *opt
  global_batch_size: 128
  lr: 1.41e-3

bs256_opt:
  <<: *opt
  global_batch_size: 256
  lr: 2e-3

bs512_opt:
  <<: *opt
  global_batch_size: 512
  lr: 2.83e-3

bs1024_opt:
  <<: *opt
  global_batch_size: 1024
  lr: 4e-3

bs2048_opt:
  <<: *opt
  global_batch_size: 2048
  lr: 5.66e-3

# Model parallel configs
mp: &mp
  <<: *base
  num_iters: 30000
  global_batch_size: 64
  lr: 1e-3
  num_data_workers: 8
  embed_dim: 1024 # change to bigger model
  data_loader_config: 'dali'
  amp_mode: fp16
  enable_jit: true
  enable_fused: true

mp_bs2:
  <<: *mp
  global_batch_size: 2
  lr: 1.77e-4

mp_bs4:
  <<: *mp
  global_batch_size: 4
  lr: 2.5e-4

mp_bs8:
  <<: *mp
  global_batch_size: 8
  lr: 3.54e-4

mp_bs16:
  <<: *mp
  global_batch_size: 16
  lr: 5e-4

mp_bs32:
  <<: *mp
  global_batch_size: 32
  lr: 7.07e-4

# larger seq length (use local bs = 1 here)
mp_patch4:
  <<: *mp
  patch_size: 4

# new configs to test on smaller cluster/gpu
